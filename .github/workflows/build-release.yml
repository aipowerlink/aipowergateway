name: build-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 从 tag 提取版本（无 tag 时用 dev）
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aipowerlink-windows-x64
            bin: aipowerlink.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aipowerlink-linux-x64
            bin: aipowerlink
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: aipowerlink-macos-x64
            bin: aipowerlink
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC toolchain for Windows)
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Rust (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build release binary
        run: cargo build --release -p aipg-cli

      - name: Package artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/release/${{ matrix.bin }} dist/${{ matrix.artifact }}/
          cp -r web/dist dist/${{ matrix.artifact }}/web
          cp README.md dist/${{ matrix.artifact }}/
          cp LICENSE dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cd dist && zip -r ${{ matrix.artifact }}-${{ env.APP_VERSION }}.zip ${{ matrix.artifact }}

      - name: Package artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/release/${{ matrix.bin }} dist/${{ matrix.artifact }}/
          cp -r web/dist dist/${{ matrix.artifact }}/web
          cp README.md dist/${{ matrix.artifact }}/
          cp LICENSE dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cd dist && zip -r ${{ matrix.artifact }}-${{ env.APP_VERSION }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true