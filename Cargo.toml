[workspace]
resolver = "2"
members = [
    "crates/runtime",
    "crates/lan-share",
    "crates/lan-client",
    "crates/lan-tray",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
async-trait = "0.1"